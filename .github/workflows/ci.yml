name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      # file: 依赖（architect-core）以 symlink 安装且源目录无构建产物；
      # 必须先显式构建 core，外壳的 typecheck/build 才能解析其类型（npm 11 默认不跑 prepare）
      - name: Build core
        run: npx tsc -b packages/architect-core/tsconfig.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 发布包内容审计（dry-run）：files 白名单与入口完整性的门禁，每次 PR 都拦
      - run: node scripts/audit-pack.mjs
