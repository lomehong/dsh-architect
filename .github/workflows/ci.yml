name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # file:../packages/architect-core 依赖大脑总仓（digital-architect，私有）——
      # 用 BRAIN_PAT secret（同 owner PAT）clone 到约定的兄弟路径
      - uses: actions/checkout@v4
        with:
          repository: lomehong/digital-architect
          token: ${{ secrets.BRAIN_PAT }}
          path: brain
      - name: Link core dependency
        run: |
          mkdir -p "$GITHUB_WORKSPACE/packages"
          ln -s "$GITHUB_WORKSPACE/brain/packages/architect-core" "$GITHUB_WORKSPACE/packages/architect-core"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # file: 依赖在 npm ci 时被快照（symlink 或拷贝）——core 的 lib 必须先于 npm ci 生成，
      # 否则快照里没有 lib，typecheck/build 链式失败（npm 11 默认不跑 prepare）
      - name: Build core (before install snapshot)
        run: |
          npm --prefix packages/architect-core install --no-audit --no-fund
          npm --prefix packages/architect-core run build
      - name: Install dependencies
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 发布包内容审计（dry-run）：files 白名单与入口完整性的门禁，每次 PR 都拦
      - run: node scripts/audit-pack.mjs
